# Render blueprint. In Render: New + > Blueprint, point it at this repo.
# Creates one Postgres database and one Node web service wired together.
databases:
  - name: storage-ae-emp-db
    plan: free
    databaseName: storage_ae
    user: storage_ae

services:
  - type: web
    name: storage-ae-employee-management
    runtime: node
    plan: free
    # Install every workspace, then build the client bundle.
    buildCommand: npm install && npm run build
    # index.js ensures the schema and seeds on first boot, then serves API + client.
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: storage-ae-emp-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: BOT_SECRET
        generateValue: true
      - key: SEED_ON_BOOT
        value: "true"
      - key: SEED_DEMO
        value: "false"
      - key: NODE_ENV
        value: production
