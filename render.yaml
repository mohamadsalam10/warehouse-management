services:
  - type: web
    name: storage-ae-ops
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      # --- single branch (simplest) ---
      - key: DEVICE_HOST
        sync: false
      - key: DEVICE_PORT
        value: 50443
      - key: DEVICE_USER
        value: admin
      - key: DEVICE_PASS
        sync: false
      - key: BRANCH_NAME
        value: Al Quoz
      # --- login ---
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      # --- display / behaviour ---
      - key: TZ_OFFSET
        value: "+04:00"
      - key: ENABLE_DOORS
        value: "false"
      # Cameras are auto-discovered from the device — nothing to set here.
      # Only if your CCTV is on a SEPARATE recorder, point cameras at it:
      # - key: CAMERA_HOST
      #   sync: false
      # - key: CAMERA_PASS
      #   sync: false
      # (Optional) force a manual camera list instead of auto-discovery:
      # - key: CAMERAS
      #   sync: false
      # For MULTIPLE branches, set BRANCHES instead of the DEVICE_* vars above (see README)
      # - key: BRANCHES
      #   sync: false
